name: Generate GitHub Contribution Breakout Game

on:
  # Runs automatically every day
  schedule:
    - cron: "0 0 * * *"
  # Allows you to run it manually
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate Contribution Breakout Game
        # This is the new, correct action from the link you found
        uses: cyprieng/github-breakout@v1
        with:
          # Your GitHub username
          github_username: ${{ github.repository_owner }}
